<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absensi QR</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:Arial;margin:0;background:#eef2f7;color:#111827}.top{background:#111827;color:white;padding:22px;text-align:center}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:white;padding:18px;border-radius:16px;margin-bottom:15px;box-shadow:0 5px 20px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.num{font-size:28px;font-weight:bold}input,select,button{width:100%;padding:11px;margin-top:7px;box-sizing:border-box;border-radius:9px;border:1px solid #ddd}button{background:#111827;color:white;border:0}.hide{display:none}.ok{background:#dcfce7;padding:15px;border-radius:12px}.err{background:#fee2e2;padding:15px;border-radius:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;white-space:nowrap}.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:999999;pointer-events:auto}.box{position:relative;z-index:1000000;background:white;padding:25px;border-radius:16px;text-align:center;width:min(420px,90%);pointer-events:auto}.box button{position:relative;z-index:1000001;pointer-events:auto;cursor:pointer}#qrcode{display:flex;justify-content:center;margin:20px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{width:auto}#reader{position:relative;z-index:1}#reader video,#reader canvas{position:relative;z-index:1}.modal.hide{display:none!important}.modal:not(.hide){display:flex!important}\n</style></head><body><header class="top"><h2 id="title">ABSENSI SEKOLAH</h2>ABSENSI QR</header><main id="home" class="wrap"><div class="card"><h3>📷 Scan Absensi</h3><select id="jenis"><option>DATANG</option><option>PULANG</option><option>DHUHA</option><option>ASHAR</option></select><div id="reader"></div><div id="res"></div></div><div class="card"><button onclick="adminLogin()">🔐 MASUK ADMIN</button></div></main><main id="login" class="wrap hide"><div class="card" style="max-width:400px;margin:50px auto"><h2>Kode Akses Admin</h2><input id="code" type="password"><button onclick="doLogin()">MASUK</button><button onclick="back()">KEMBALI</button><div id="lm"></div></div></main><main id="adm" class="wrap hide"><div class="card tabs"><button onclick="panel('dashboard')">Dashboard</button><button onclick="panel('siswa')">Data Siswa</button><button onclick="panel('rekap')">Rekap</button><button onclick="panel('pengaturan')">Pengaturan</button><button onclick="location.reload()">Keluar</button></div><section id="dashboard"><div class="card"><input id="dt" type="date" onchange="loadDash()"><div class="grid"><div class="card">Siswa<div class="num" id="a">0</div></div><div class="card">Datang<div class="num" id="b">0</div></div><div class="card">Belum<div class="num" id="c">0</div></div><div class="card">Terlambat<div class="num" id="d">0</div></div><div class="card">Pulang<div class="num" id="e">0</div></div><div class="card">Dhuha<div class="num" id="f">0</div></div><div class="card">Ashar<div class="num" id="g">0</div></div></div></div><div class="card"><h3>Belum Absen</h3><div class="scroll"><table><tbody id="belum"></tbody></table></div></div></section><section id="siswa" class="hide"><div class="card"><h3>Tambah Siswa</h3><div class="grid"><input id="nis" placeholder="NIS"><input id="nisn" placeholder="NISN"><input id="nama" placeholder="Nama"><input id="kelas" placeholder="Kelas"><input id="jurusan" placeholder="Jurusan"><input id="jk" placeholder="JK"></div><button onclick="addStudent()">SIMPAN + BUAT QR</button></div><div class="card"><input id="q" oninput="render()" placeholder="Cari siswa"><div class="scroll"><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>QR</th><th>Aksi</th></tr></thead><tbody id="st"></tbody></table></div></div></section><section id="rekap" class="hide"><div class="card"><input id="rd" type="date" onchange="loadRekap()"><button onclick="csv()">EXPORT CSV</button><div class="scroll"><table><tbody id="rk"></tbody></table></div></div></section><section id="pengaturan" class="hide"><div class="card"><input id="sn" placeholder="Nama sekolah"><input id="lt" placeholder="Batas terlambat, contoh 07:15"><button onclick="saveSet()">SIMPAN</button></div><div class="card"><h3>Ganti Kode Admin</h3><input id="nc" type="password"><button onclick="changeCode()">GANTI KODE</button></div></section></main><div id="modal" class="modal hide"><div class="box"><h2 id="qn"></h2><div id="qrcode"></div><button type="button" onclick="printQR()">CETAK QR</button><button type="button" id="closeQrBtn">TUTUP</button></div></div><script>
const API='https://script.google.com/macros/s/AKfycbyFJBnmlySRu4nDz963DiAzX2mTZ0XRHdWGTnm_VINhXIFTCJsQLjs9yZZhAo2_4Yd8rw/exec';let data=[],rek=[];
async function api(action,x={}){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...x})});return r.json()}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})}
function adminLogin(){home.classList.add('hide');login.classList.remove('hide')}
function back(){login.classList.add('hide');home.classList.remove('hide')}
async function doLogin(){let x=await api('login',{code:code.value});if(x.success){login.classList.add('hide');adm.classList.remove('hide');dt.value=rd.value=today();loadAll()}else lm.innerHTML='<div class="err">'+x.message+'</div>'}
function panel(x){['dashboard','siswa','rekap','pengaturan'].forEach(i=>document.getElementById(i).classList.add('hide'));document.getElementById(x).classList.remove('hide');if(x==='siswa')loadStudents();if(x==='rekap')loadRekap();if(x==='pengaturan')loadSet()}
async function loadAll(){loadDash();loadStudents();loadRekap();loadSet()}
async function loadDash(){let x=await api('dashboard',{date:dt.value});if(x.success){a.textContent=x.data.total;b.textContent=x.data.datang;c.textContent=x.data.belum;d.textContent=x.data.terlambat;e.textContent=x.data.pulang;f.textContent=x.data.dhuha;g.textContent=x.data.ashar}let y=await api('belum',{date:dt.value});belum.innerHTML=(y.data||[]).map(s=>'<tr><td>'+s.NIS+'</td><td>'+s.NAMA+'</td><td>'+s.KELAS+'</td></tr>').join('')}
async function loadStudents(){let x=await api('students');data=x.data||[];render()}
function render(){let z=(q.value||'').toLowerCase();st.innerHTML=data.filter(s=>(s.NIS+' '+s.NAMA+' '+s.KELAS).toLowerCase().includes(z)).map(s=>'<tr><td>'+s.NIS+'</td><td>'+s.NAMA+'</td><td>'+s.KELAS+'</td><td><button onclick="showQR(\''+s.TOKEN_QR+'\',\''+String(s.NAMA).replace(/'/g,'')+'\')">QR</button></td><td><button onclick="resetQR(\''+s.ID+'\')">Reset</button></td></tr>').join('')}
async function addStudent(){let x=await api('add',{nis:nis.value,nisn:nisn.value,nama:nama.value,kelas:kelas.value,jurusan:jurusan.value,jk:jk.value});alert(x.success?'Siswa tersimpan dan QR dibuat':x.message);if(x.success)loadAll()}
async function resetQR(id){let x=await api('reset',{id});alert(x.success?'QR baru dibuat':x.message);loadStudents()}
function showQR(t,n){qn.textContent=n;qrcode.innerHTML='';new QRCode(qrcode,{text:t,width:280,height:280});modal.classList.remove('hide');modal.style.display='flex'}
function closeQR(){document.getElementById('modal').classList.add('hide');document.getElementById('modal').style.display='none'}\ndocument.addEventListener('DOMContentLoaded',()=>{document.getElementById('closeQrBtn').addEventListener('click',closeQR);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeQR()})});\nfunction printQR(){window.print()}
async function loadRekap(){let x=await api('rekap',{date:rd.value});rek=x.data||[];rk.innerHTML='<tr><th>Jam</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Jenis</th><th>Status</th></tr>'+rek.map(a=>'<tr><td>'+a.JAM+'</td><td>'+a.NIS+'</td><td>'+a.NAMA+'</td><td>'+a.KELAS+'</td><td>'+a.JENIS+'</td><td>'+a.STATUS+'</td></tr>').join('')}
function csv(){let s='Tanggal,Jam,NIS,Nama,Kelas,Jenis,Status\n'+rek.map(x=>[x.TANGGAL,x.JAM,x.NIS,x.NAMA,x.KELAS,x.JENIS,x.STATUS].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(s);a.download='rekap.csv';a.click()}
async function loadSet(){let x=await api('settings');if(x.success){sn.value=x.data.NAMA_SEKOLAH||'';lt.value=x.data.BATAS_TERLAMBAT||'';title.textContent=x.data.NAMA_SEKOLAH||'ABSENSI SEKOLAH'}}
async function saveSet(){let x=await api('saveSettings',{data:{NAMA_SEKOLAH:sn.value,BATAS_TERLAMBAT:lt.value}});alert(x.success?'Tersimpan':x.message)}
async function changeCode(){let x=await api('changeCode',{code:nc.value});alert(x.success?'Kode berhasil diganti':x.message)}
let busy=false;async function scan(t){if(busy)return;busy=true;let x=await api('scan',{token:t,jenis:jenis.value});res.className=x.success?'ok':'err';res.innerHTML=x.success?'✓ '+x.siswa.NAMA+' | '+x.siswa.KELAS+' | '+x.jam+' | '+x.status:'⚠️ '+x.message;setTimeout(()=>busy=false,1200)}
new Html5Qrcode('reader').start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},scan).catch(()=>res.innerHTML='<div class="err">Kamera gagal. Pastikan HTTPS dan izin kamera aktif.</div>');
</script></body></html>
